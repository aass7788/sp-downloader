name: Deploy to Server

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare cookies (strip newlines)
        id: cookies
        run: |
          RAW="${{ secrets.COOKIES_BASE64 }}"
          if [ -z "$RAW" ]; then
            echo "::warning::COOKIES_BASE64 secret is empty or not configured"
            echo "value=" >> $GITHUB_OUTPUT
          else
            CLEAN=$(echo "$RAW" | tr -d '\n\r' | tr -d ' ')
            echo "value=${CLEAN}" >> $GITHUB_OUTPUT
            echo "Cookies base64 prepared (length=${#CLEAN})"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          env: |
            COOKIES_BASE64=${{ steps.cookies.outputs.value }}
          script: |
            set -e

            # Debug
            if [ -n "$COOKIES_BASE64" ]; then
              echo "[debug] COOKIES_BASE64 length=${#COOKIES_BASE64}"
            else
              echo "[debug] COOKIES_BASE64 EMPTY - cookies skipped"
            fi

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker && systemctl start docker
            fi

            # Deploy
            APP_DIR=/opt/sp-downloader

            if [ -d "$APP_DIR/.git" ]; then
              echo "Pulling latest code..."
              cd $APP_DIR
              git checkout master
              git pull origin master
            else
              echo "Cloning repository..."
              rm -rf $APP_DIR
              git clone https://github.com/aass7788/sp-downloader.git $APP_DIR
              cd $APP_DIR
            fi

            # Copy .env if exists
            if [ -f $APP_DIR/.env ]; then
              echo ".env file found"
            else
              echo "PORT=3456" > $APP_DIR/.env
            fi

            # Write cookies.txt from GitHub Secret
            if [ -n "$COOKIES_BASE64" ]; then
              rm -rf $APP_DIR/cookies.txt
              echo "$COOKIES_BASE64" | base64 -d > $APP_DIR/cookies.txt
              echo "cookies.txt written ($(wc -c < $APP_DIR/cookies.txt) bytes)"
            else
              echo "[warn] No cookies secret, skipping cookies.txt"
            fi

            # Build and restart
            echo "Starting containers..."
            docker compose up -d --build

            # Clean up old images
            docker image prune -f

            echo ""
            echo "=== Deploy Complete ==="
            docker compose ps
